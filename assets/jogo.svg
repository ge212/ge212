<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <style>
    .player { animation: jump 3s infinite; }
    .cactus { animation: run 3s linear infinite; }
    .cloud  { animation: cloud 12s linear infinite; }
    @keyframes run   { from { transform: translateX(0); } to { transform: translateX(-860px); } }
    @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(-900px); } }
    @keyframes jump  {
      0%, 70%  { transform: translateY(0); }
      80%, 88% { transform: translateY(-60px); }
      96%, 100% { transform: translateY(0); }
    }
  </style>
  <rect width="800" height="160" rx="12" fill="#0F172A"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#38BDF8" stroke-width="2"/>
  <g class="cloud"><rect x="700" y="30" width="50" height="10" rx="5" fill="#312E81"/></g>
  <g class="player">
    <rect x="100" y="90" width="30" height="30" rx="4" fill="#0891B2"/>
    <rect x="120" y="98" width="6" height="6" fill="#FFFFFF"/>
  </g>
  <g class="cactus">
    <rect x="820" y="85" width="14" height="35" fill="#38BDF8"/>
    <rect x="812" y="95" width="8" height="6" fill="#38BDF8"/>
  </g>
</svg>
